<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공공조달관리사 필기시험 400제 모의고사 | Procure</title>
  <meta name="description" content="공공조달관리사 필기시험 400제 및 1~3권 랜덤 10제 스마트 모의시험 시스템" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-subtle: #e2e8f0;
      --border-focus: #3b82f6;

      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;

      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --primary-border: #bfdbfe;

      --accent: #8b5cf6;
      --accent-subtle: #f5f3ff;
      --accent-border: #ddd6fe;

      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;

      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;

      --star: #f59e0b;
      --star-bg: #fffbeb;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.06);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.04);
      --shadow-lg: 0 12px 24px -4px rgb(0 0 0 / 0.08);

      --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme='dark'] {
      --bg-main: #0b0f19;
      --bg-card: #131b2e;
      --bg-subtle: #1c263c;
      --border-subtle: #23304a;
      --border-focus: #60a5fa;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;

      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: #1e293b;
      --primary-border: #2563eb;

      --accent: #a78bfa;
      --accent-subtle: #2e1065;
      --accent-border: #7c3aed;

      --success: #34d399;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-border: rgba(16, 185, 129, 0.35);
      --success-text: #6ee7b7;

      --danger: #f87171;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-border: rgba(239, 68, 68, 0.35);
      --danger-text: #fca5a5;

      --star: #fbbf24;
      --star-bg: rgba(245, 158, 11, 0.15);

      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.4);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
      --shadow-lg: 0 12px 24px -4px rgb(0 0 0 / 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button, select, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
      padding: 0.85rem 1.5rem;
    }
    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-badge {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 0.725rem;
      font-weight: 800;
      padding: 0.25rem 0.55rem;
      border-radius: var(--radius-sm);
      letter-spacing: 0.05em;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .header-actions { display: flex; align-items: center; gap: 0.6rem; }
    .view-mode-pill {
      display: flex;
      background: var(--bg-subtle);
      padding: 0.2rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
    }
    .pill-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      color: var(--text-muted);
      transition: var(--transition);
    }
    .pill-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
      transition: var(--transition);
    }
    .icon-btn:hover { background: var(--bg-subtle); color: var(--text-main); }

    /* Main Container */
    .study-container {
      max-width: 980px;
      margin: 1.75rem auto 3rem auto;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Category Bar */
    .category-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 4px;
      align-items: center;
    }
    .cat-btn {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      white-space: nowrap;
      transition: var(--transition);
    }
    .cat-btn:hover { border-color: var(--border-focus); color: var(--text-main); }
    .cat-btn.active {
      background: var(--primary-subtle);
      color: var(--primary);
      border-color: var(--primary-border);
    }
    .cat-btn.random-mode {
      background: var(--accent-subtle);
      color: var(--accent);
      border-color: var(--accent-border);
      font-weight: 700;
    }
    .cat-btn.random-mode.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.35);
    }

    /* Random Banner */
    .random-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      animation: fadeIn 0.25s ease-out;
    }
    .random-banner-title {
      font-size: 0.925rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .random-banner-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-random-respin {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      transition: var(--transition);
    }
    .btn-random-respin:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-random-quit {
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
    }
    .progress-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
    }
    .question-select {
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
    }
    .filter-buttons { display: flex; align-items: center; gap: 0.5rem; }
    .chip-btn {
      padding: 0.3rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-muted);
      transition: var(--transition);
    }
    .chip-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .chip-btn.active-wrong {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }
    .chip-btn.active-star {
      background: var(--star-bg);
      color: var(--star);
      border-color: var(--star);
    }

    /* Study Card */
    .study-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      transition: var(--transition);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .q-badge { display: flex; align-items: center; gap: 0.5rem; }
    .badge-num {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-subtle);
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--primary-border);
    }
    .badge-cat {
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-subtle);
      padding: 0.3rem 0.65rem;
      border-radius: var(--radius-sm);
    }
    .btn-star {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.825rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      transition: var(--transition);
    }
    .btn-star.starred {
      background: var(--star-bg);
      color: var(--star);
      border-color: var(--star);
    }

    /* Question Title */
    .question-text {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.6;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    /* Choices */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .choice-btn {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.1rem 1.35rem;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      line-height: 1.5;
      transition: var(--transition);
      width: 100%;
    }
    .choice-btn:hover {
      border-color: var(--border-focus);
      background: var(--bg-subtle);
      transform: translateY(-1px);
    }
    .choice-btn.selected {
      border-color: var(--primary);
      background: var(--primary-subtle);
    }
    .choice-btn.is-correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: var(--success-text);
      font-weight: 600;
    }
    .choice-btn.is-wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
      color: var(--danger-text);
    }
    .choice-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.825rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .choice-btn.selected .choice-num {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .choice-btn.is-correct .choice-num {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }
    .choice-btn.is-wrong .choice-num {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }
    .choice-label { flex: 1; }
    .choice-status-tag {
      font-size: 0.85rem;
      font-weight: 800;
      margin-left: auto;
    }

    /* Solution Box */
    .solution-box {
      background: var(--bg-subtle);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      animation: fadeIn 0.25s ease-out;
    }
    .solution-title {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    .solution-body {
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.65;
    }

    /* Card Footer */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-subtle);
    }
    .nav-action-btn {
      padding: 0.7rem 1.35rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-action-btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: var(--border-focus);
    }
    .nav-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-action-btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .nav-action-btn.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 1.75rem;
      gap: 1.25rem;
      box-shadow: var(--shadow-lg);
    }

    /* Score Report in Random Mode */
    .score-card {
      text-align: center;
      padding: 1.5rem;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      margin-top: 1rem;
    }
    .score-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .score-val { font-size: 2.5rem; font-weight: 900; color: var(--primary); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-badge">PROCURE</span>
        <h1 class="brand-title" id="page-title">공공조달관리사 필기시험 400제 모의고사</h1>
      </div>

      <div class="header-actions">
        <!-- View Mode -->
        <div class="view-mode-pill">
          <button id="btn-mode-quiz" class="pill-btn active" onclick="setViewMode('quiz')">✏️ 문제 풀기</button>
          <button id="btn-mode-study" class="pill-btn" onclick="setViewMode('study')">📖 정답·해설 보기</button>
        </div>

        <!-- JSON Modal Button -->
        <button class="icon-btn" onclick="openJsonModal()" title="400제 문제 데이터(JSON) 관리">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="12" y1="18" x2="12" y2="12" />
            <line x1="9" y1="15" x2="15" y2="15" />
          </svg>
        </button>

        <!-- Dark/Light Theme -->
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="다크/라이트 모드 전환">
          🌙
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="study-container">
    <!-- Category Filter Bar -->
    <div class="category-bar" id="category-bar"></div>

    <!-- Random 10 Mode Banner (shown when active) -->
    <div id="random-banner" class="random-banner" style="display: none;">
      <div class="random-banner-title">
        <span>🎲</span>
        <span><strong>1~3권 랜덤 10제 미니 모의시험</strong> 진행 중 (총 300문항 중 10문제 무작위 추출)</span>
      </div>
      <div class="random-banner-actions">
        <button class="btn-random-respin" onclick="startRandom10Exam()">🔄 새 10문제 뽑기</button>
        <button class="btn-random-quit" onclick="exitRandom10Mode()">전체 목록으로 나가기</button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="progress-info">
        <span>문항 이동:</span>
        <select id="question-select" class="question-select" onchange="jumpToQuestion(Number(this.value))"></select>
        <span id="question-counter" style="color: var(--text-muted)"></span>
      </div>

      <div class="filter-buttons">
        <button class="chip-btn active" id="filter-all" onclick="setFilter('all')">전체 보기</button>
        <button class="chip-btn" id="filter-wrong" onclick="setFilter('wrong')">⚠️ 오답노트 (<span id="wrong-count">0</span>)</button>
        <button class="chip-btn" id="filter-star" onclick="setFilter('bookmarked')">★ 북마크 (<span id="bookmark-count">0</span>)</button>
      </div>
    </div>

    <!-- Question Study Card -->
    <div id="card-container"></div>
  </main>

  <!-- JSON Modal -->
  <div id="json-modal" class="modal-backdrop" style="display: none;" onclick="closeJsonModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2 style="font-size: 1.25rem; font-weight: 800;">문제 데이터 (JSON) 관리</h2>
          <p style="font-size: 0.8rem; color: var(--text-muted);">전체 400문제 JSON 데이터를 열람하거나 직접 수정하여 저장할 수 있습니다.</p>
        </div>
        <button onclick="closeJsonModal()" style="font-size: 1.25rem; color: var(--text-muted);">✕</button>
      </div>

      <div id="json-error" style="display: none; padding: 0.65rem; background: var(--danger-bg); color: var(--danger-text); border-radius: var(--radius-sm); font-size: 0.85rem;"></div>

      <textarea id="json-textarea" style="width: 100%; height: 320px; font-family: monospace; font-size: 0.825rem; padding: 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-subtle); color: var(--text-main); line-height: 1.4;"></textarea>

      <div style="display: flex; justify-content: space-between; gap: 0.5rem;">
        <button class="nav-action-btn" onclick="resetToDefaultJson()" style="color: var(--danger);">기본 400제로 복원</button>
        <div style="display: flex; gap: 0.5rem;">
          <button class="nav-action-btn" onclick="closeJsonModal()">닫기</button>
          <button class="nav-action-btn primary" onclick="saveJsonData()">저장 및 적용</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Injected 400-Question Data

을 위해 공개경쟁입찰을 원칙으로 합니다."}, {"id": 199, "category_id": 1, "question": "[1권 심화 Q99] OECD 공공조달 12대 실행원칙 중 '청렴성' 확보를 위한 방안으로 적절하지 않은 것은? (변형 유형 10)", "options": ["이해충돌 방지 장치 마련", "조달 과정의 위험 관리 체계 구축", "특정 장기 거래업체에 대한 입찰 자격 무조건 부여", "공정성과 투명성을 높이기 위한 전자조달시스템 활용"], "answer": 2, "explanation": "1권 핵심 법령 및 이론 응용 해설: 특정 업체에 무조건 자격을 부여하는 것은 청렴성 및 경쟁 원칙에 위배됩니다."}, {"id": 200, "category_id": 1, "question": "[1권 심화 Q100] 낙찰자 선정 방식 중 'QCBS(품질·비용기반선정)'에 대한 설명으로 옳은 것은? (변형 유형 10)", "options": ["가격 평가만으로 낙찰자를 선정한다.", "기술 점수와 가격 점수를 종합 합산하여 선정한다.", "가격을 완전히 배제하고 기술 평가만으로 결정한다.", "확정된 예산 범위 내에서 최하위 가격을 제시한 자를 선정한다."], "answer": 1, "explanation": "1권 핵심 법령 및 이론 응용 해설: QCBS는 기술 평가 점수와 가격 평가 점수를 합산하여 낙찰자를 결정하는 방식입니다(예: 협상에 의한 계약)."}, {"id": 201, "category_id": 2, "question": "사전규격공개 기간에 대한 설명으로 올바른 것은?", "options": ["일반적인 사업은 5일 이상 공개한다.", "긴급을 요하는 사업은 1일간 공개한다.", "SW 구축사업은 5일간 공개한다.", "모든 규격공개는 예외 없이 10일 이상 공개해야 한다."], "answer": 0, "explanation": "사전규격공개 기간은 일반 5일 이상, 긴급/소액 3일 이상, SW 사업 등 고도화 사업은 10일 이상입니다."}, {"id": 202, "category_id": 2, "question": "협상에 의한 계약에서 협상적격자를 선정하는 기준으로 옳은 것은?", "options": ["기술능력평가 분야 배점한도의 70% 이상인 자", "기술능력평가 분야 배점한도의 85% 이상인 자", "기술 및 가격 평가 합산점수가 80점 이상인 자", "가격평가 점수가 최상위인 자"], "answer": 1, "explanation": "협상에 의한 계약 체결기준상 제안서 평가결과 기술능력평가 분야 배점한도의 85% 이상인 자를 협상적격자로 선정합니다."}, {"id": 203, "category_id": 2, "question": "Kraljic의 구매 포트폴리오 매트릭스에서 공급위험도와 재정적 영향이 모두 높은 품목은?", "options": ["일반 품목(Non-critical)", "레버리지 품목(Leverage)", "병목 품목(Bottleneck)", "핵심 전략 품목(Strategic)"], "answer": 3, "explanation": "공급위험과 재정적 영향이 모두 높은 품목은 '핵심 전략 품목(Strategic Items)'입니다."}, {"id": 204, "category_id": 2, "question": "공공조달 수명주기 5단계에 해당하지 않는 것은?", "options": ["조달 계획 수립", "시장조사 및 분석", "입찰 및 낙찰자 결정", "민간 자산 매각 및 주식 발행"], "answer": 3, "explanation": "공공조달 수명주기 5단계는 조달계획 수립, 시장조사, 입찰/낙찰, 계약관리, 계약종결입니다."}, {"id": 205, "category_id": 2, "question": "입찰공고 기간 기준 중 일반적인 공개경쟁입찰의 법정 최소 공고 기간은?", "options": ["3일 이상", "5일 이상", "7일 이상", "14일 이상"], "answer": 2, "explanation": "일반 공개경쟁입찰의 공고기간은 현장설명회 미실시 시 7일 이상입니다(국제입찰/RFP사업은 40일)."}, {"id": 206, "category_id": 2, "question": "과업명세서(SOW: Statement of Work)에 관한 설명으로 가장 적절한 것은?", "options": ["계약 상대자가 작성하여 발주처에 제출하는 납품서이다.", "발주기관이 조달 대상물의 범위, 세부 요구사항, 성과기준을 명시한 문서이다.", "공급업체의 재무상태만을 기록한 회계 보고서이다.", "입찰서 제출 시 첨부하는 가격 제안서이다."], "answer": 1, "explanation": "과업명세서(SOW)는 발주기관이 조달 과업의 범위, 품질, 성능, 성과기준을 구체적으로 규정한 문서입니다."}, {"id": 207, "category_id": 2, "question": "확정가격계약(Fixed-Price Contract)과 원가보상계약(Cost-Reimbursement Contract)의 위험 분배 비교로 옳은 것은?", "options": ["확정가격계약은 발주기관이 원가 상승 위험을 전적으로 부담한다.", "원가보상계약은 공급업체가 불확실성에 대한 위험을 전적으로 부담한다.", "확정가격계약은 불확실성이 낮은 일반 물품 구매에 적합하며 공급업체가 위험을 주로 부담한다.", "원가보상계약은 표준화된 물품을 최저가로 구매할 때 사용한다."], "answer": 2, "explanation": "확정가격계약은 불확실성이 낮을 때 사용하며 공급업체가 가격위험을 부담합니다."}, {"id": 208, "category_id": 2, "question": "ISO 31000 리스크 관리 표준에 따른 리스크 대응 4대 전략이 아닌 것은?", "options": ["회피(Avoidance)", "완화(Mitigation)", "전가(Transfer)", "방치(Neglect)"], "answer": 3, "explanation": "리스크 대응 4대 전략은 회피, 완화, 전가, 수용(Acceptance)입니다."}, {"id": 209, "category_id": 2, "question": "제안서 평가 시 기술능력평가와 입찰가격평가의 일반적인 배점 비중 기준(협상에 의한 계약)은?", "options": ["기술 50% : 가격 50%", "기술 70% : 가격 30%", "기술 80% : 가격 20%", "기술 100% : 가격 0%"], "answer": 2, "explanation": "협상에 의한 계약에서 일반적인 평가 배점 비중은 기술능력평가 80점, 입찰가격평가 20점입니다."}, {"id": 210, "category_id": 2, "question": "사전규격공개 시 공급업체가 의견을 제출할 수 있는 주된 목적은?", "options": ["발주기관의 예산을 증액시키기 위해", "특혜성 독소조항이나 불공정 규격을 사전 검증하고 수정 요청하기 위해", "입찰 참가 등록을 자동으로 완료하기 위해", "계약 보증금을 면제받기 위해"], "answer": 1, "explanation": "사전규격공개는 특정 업체 특혜나 불공정 규격을 사전에 적발·수정하기 위한 제도입니다."}, {"id": 211, "category_id": 2, "question": "[2권 심화 Q11] 사전규격공개 기간에 대한 설명으로 올바른 것은? (응용 유형 2)", "options": ["일반적인 사업은 5일 이상 공개한다.", "긴급을 요하는 사업은 1일간 공개한다.", "SW 구축사업은 5일간 공개한다.", "모든 규격공개는 예외 없이 10일 이상 공개해야 한다."], "answer": 0, "explanation": "2권 조달계획 및 평가 심화 해설: 사전규격공개 기간은 일반 5일 이상, 긴급/소액 3일 이상, SW 사업 등 고도화 사업은 10일 이상입니다."}, {"id": 212, "category_id": 2, "question": "[2권 심화 Q12] 협상에 의한 계약에서 협상적격자를 선정하는 기준으로 옳은 것은? (응용 유형 2)", "options" tegory_id": 2, "question": "[2권 심화 Q92] 협상에 의한 계약에서 협상적격자를 선정하는 기준으로 옳은 것은? (응용 유형 10)", "options": ["기술능력평가 분야 배점한도의 70% 이상인 자", "기술능력평가 분야 배점한도의 85% 이상인 자", "기술 및 가격 평가 합산점수가 80점 이상인 자", "가격평가 점수가 최상위인 자"], "answer": 1, "explanation": "2권 조달계획 및 평가 심화 해설: 협상에 의한 계약 체결기준상 제안서 평가결과 기술능력평가 분야 배점한도의 85% 이상인 자를 협상적격자로 선정합니다."}, {"id": 293, "category_id": 2, "question": "[2권 심화 Q93] Kraljic의 구매 포트폴리오 매트릭스에서 공급위험도와 재정적 영향이 모두 높은 품목은? (응용 유형 10)", "options": ["일반 품목(Non-critical)", "레버리지 품목(Leverage)", "병목 품목(Bottleneck)", "핵심 전략 품목(Strategic)"], "answer": 3, "explanation": "2권 조달계획 및 평가 심화 해설: 공급위험과 재정적 영향이 모두 높은 품목은 '핵심 전략 품목(Strategic Items)'입니다."}, {"id": 294, "category_id": 2, "question": "[2권 심화 Q94] 공공조달 수명주기 5단계에 해당하지 않는 것은? (응용 유형 10)", "options": ["조달 계획 수립", "시장조사 및 분석", "입찰 및 낙찰자 결정", "민간 자산 매각 및 주식 발행"], "answer": 3, "explanation": "2권 조달계획 및 평가 심화 해설: 공공조달 수명주기 5단계는 조달계획 수립, 시장조사, 입찰/낙찰, 계약관리, 계약종결입니다."}, {"id": 295, "category_id": 2, "question": "[2권 심화 Q95] 입찰공고 기간 기준 중 일반적인 공개경쟁입찰의 법정 최소 공고 기간은? (응용 유형 10)", "options": ["3일 이상", "5일 이상", "7일 이상", "14일 이상"], "answer": 2, "explanation": "2권 조달계획 및 평가 심화 해설: 일반 공개경쟁입찰의 공고기간은 현장설명회 미실시 시 7일 이상입니다(국제입찰/RFP사업은 40일)."}, {"id": 296, "category_id": 2, "question": "[2권 심화 Q96] 과업명세서(SOW: Statement of Work)에 관한 설명으로 가장 적절한 것은? (응용 유형 10)", "options": ["계약 상대자가 작성하여 발주처에 제출하는 납품서이다.", "발주기관이 조달 대상물의 범위, 세부 요구사항, 성과기준을 명시한 문서이다.", "공급업체의 재무상태만을 기록한 회계 보고서이다.", "입찰서 제출 시 첨부하는 가격 제안서이다."], "answer": 1, "explanation": "2권 조달계획 및 평가 심화 해설: 과업명세서(SOW)는 발주기관이 조달 과업의 범위, 품질, 성능, 성과기준을 구체적으로 규정한 문서입니다."}, {"id": 297, "category_id": 2, "question": "[2권 심화 Q97] 확정가격계약(Fixed-Price Contract)과 원가보상계약(Cost-Reimbursement Contract)의 위험 분배 비교로 옳은 것은? (응용 유형 10)", "options": ["확정가격계약은 발주기관이 원가 상승 위험을 전적으로 부담한다.", "원가보상계약은 공급업체가 불확실성에 대한 위험을 전적으로 부담한다.", "확정가격계약은 불확실성이 낮은 일반 물품 구매에 적합하며 공급업체가 위험을 주로 부담한다.", "원가보상계약은 표준화된 물품을 최저가로 구매할 때 사용한다."], "answer": 2, "explanation": "2권 조달계획 및 평가 심화 해설: 확정가격계약은 불확실성이 낮을 때 사용하며 공급업체가 가격위험을 부담합니다."}, {"id": 298, "category_id": 2, "question": "[2권 심화 Q98] ISO 31000 리스크 관리 표준에 따른 리스크 대응 4대 전략이 아닌 것은? (응용 유형 10)", "options": ["회피(Avoidance)", "완화(Mitigation)", "전가(Transfer)", "방치(Neglect)"], "answer": 3, "explanation": "2권 조달계획 및 평가 심화 해설: 리스크 대응 4대 전략은 회피, 완화, 전가, 수용(Acceptance)입니다."}, {"id": 299, "category_id": 2, "question": "[2권 심화 Q99] 제안서 평가 시 기술능력평가와 입찰가격평가의 일반적인 배점 비중 기준(협상에 의한 계약)은? (응용 유형 10)", "options": ["기술 50% : 가격 50%", "기술 70% : 가격 30%", "기술 80% : 가격 20%", "기술 100% : 가격 0%"], "answer": 2, "explanation": "2권 조달계획 및 평가 심화 해설: 협상에 의한 계약에서 일반적인 평가 배점 비중은 기술능력평가 80점, 입찰가격평가 20점입니다."}, {"id": 300, "category_id": 2, "question": "[2권 심화 Q100] 사전규격공개 시 공급업체가 의견을 제출할 수 있는 주된 목적은? (응용 유형 10)", "options": ["발주기관의 예산을 증액시키기 위해", "특혜성 독소조항이나 불공정 규격을 사전 검증하고 수정 요청하기 위해", "입찰 참가 등록을 자동으로 완료하기 위해", "계약 보증금을 면제받기 위해"], "answer": 1, "explanation": "2권 조달계획 및 평가 심화 해설: 사전규격공개는 특정 업체 특혜나 불공정 규격을 사전에 적발·수정하기 위한 제도입니다."}, {"id": 301, "category_id": 3, "question": "물가변동으로 인한 계약금액 조정(Escalation)의 요건으로 옳은 것은?", "options": ["계약체결 후 60일 경과 및 품목조정률 3% 이상", "계약체결 후 90일 경과 및 품목조정률(또는 지수조정률) 3% 이상", "계약체결 후 180일 경과 및 품목조정률 5% 이상", "계약체결 후 30일 경과 및 품목조정률 1% 이상"], "answer": 1, "explanation": "물가변동 계약금액 조정은 계약체결 후 90일 이상 경과하고, 품목조정률 또는 지수조정률이 100분의 3(3%) 이상 변동된 때 적용합니다."}, {"id": 302, "category_id": 3, "question": "다수공급자계약(MAS) 2단계 경쟁에 관한 설명으로 옳지 않은 것은?", "options": ["중소기업자 간 경쟁제품의 경우 1회 납품요구금액 1억 원 이상일 때 실시한다.", "제안가격은 종합쇼핑몰 계약가격의 90% 미만으로 제출할 수 없다.", "제안서 제출기한까지 제출하지 않은 경우 계약가격으로 제안한 것으로 본다.", "가격 제안 시 계약가격보다 비싸게 제출할 수 있다."], "answer": 3, "explanation": "MAS 2단계 경쟁에서 제안가격은 나라장터 종합쇼핑몰 계약가격을 초과할 수 없습니다."}, {"id": 303, "category_id": 3, "question": "공공계약의 지체상금 및 보증금 제도에 대한 설명으로 올바른 것은?", "options": ["계약보증금은 계약금액의 50% 이상을 납부해야 한다.", "지체상금 총 부과 한도는 계약금액의 30%를 초과할 수 없다.", "선금 지급 한도는 계약금액의 최대 10%로 제한된다.", "검사 완료 후 대금 지급 기한은 30일 이내이다."], "answer": 1, "explanation": "지체상금 상한선은 계약금액의 30% 이내입니다. 계약보증금은 10% 이상, 대금지급은 검사 후 5일 이내입니다."}, {"id": 304, "category_id": 3, "question": "공공조달 품질관리 4단계 중 시장 진입 단계에서 부적격 업체를 차단하는 제도는?", "options": ["품질기동점검 제도", "직접생산확인 제도", "전문기관 납품검사", "불량품 신문고"], "answer": 1, "explanation": "진입 단계에서는 실제 제조 능력을 확인하는 직접생산확인 제도를 적용합니다."}, {"id": 305, "category_id": 3, "question": "우수조달물품(우수제품) 지정제도의 지정 기간으로 옳은 것은?", "options": ["지정일로부터 1년 (연장 불가)", "지정일로부터 3년 (요건 충족 시 최대 3년 추가 연장 가능)", "지정일로부터 5년 (무제한 연장)", "지정일로부터 10년"], "answer": 1, "explanation": "우수조달물품 지정기간은 기본 3년이며, 수출·고용·기술개발 등 요건 충족 시 최대 3년 연장 가능합니다."}, {"id": 306, "category_id": 3, "question": "설계변경으로 인한 공사 계약금액 조정 시 발주기관이 입안하여 변경한 경우 신규 비목의 단가 적용 기준은?", "options": ["계약단가를 적용한다.", "설계변경 당시를 기준으로 산정한 단가에 낙찰률을 곱한 금액으로 한다.", "설계변경 당시 기준 단가와 동 단가에 낙찰률을 곱한 금액의 50% 범위 내에서 협의 결정한다.", "낙찰률을 적용하지 않고 설계변경 당시 단가 100%를 적용한다."], "answer": 2, "explanation": "발주기관 요구로 인한 설계변경 시 신규비목은 변경당시 단가와 동 단가x낙찰률의 50% 협의 금액을 적용합니다."}, {"id": 307, "category_id": 3, "question": "공공계약에서 선금(Prepayment) 지급 신청 시 최대로 지급받을 수 있는 법정 한도 비율은?", "options": ["계약금액의 30%", "계약금액의 50%", "계약금액의 70%", "계약금액의 100%"], "answer": 2, "explanation": "공공계약에서 선금 지급 한도는 계약금액의 70% 이내입니다."}, {"id": 308, "category_id": 3, "question": "기성 및 기납 검사 기한과 검사 완료 후 대금 지급 기한의 연결로 올바른 것은?", "options": ["검사 14일 이내 / 대금지급 5일 이내", "검사 30일 이내 / 대금지급 14일 이내", "검사 7일 이내 / 대금지급 10일 이내", "검사 20일 이내 / 대금지급 7일 이내"], "answer": 0, "explanation": "검사 기한은 청구일로부터 14일 이내, 검사 완료 후 대금 지급은 청구일로부터 5일 이내입니다."}, {"id": 309, "category_id": 3, "question": "기술형 공사(일괄입찰/대안입찰/기술제안입찰)의 설계변경 시 시공자 귀책사유인 경우의 계약금액 조정 원칙은?", "options": ["계약금액을 증액할 수 없다.", "계약금액을 무조건 50% 증액한다.", "기획재정부장관 승인 시 증액 가능하다.", "물가변동률만큼 증액한다."], "answer": 0, "explanation": "기술형 공사에서 시공자 귀책사유로 인한 설계변경 시 계약금액 증액은 허용되지 않습니다."}, {"id": 310, "category_id": 3, "question": "다수공급자계약(MAS)의 계약기간 특성에 대한 설명으로 옳은 것은?", "options": ["모든 MAS 계약은 단 1년으로 고정된다.", "품목별로 통상 3년(최대 10년 범위) 장기계약으로 체결된다.", "매월 재계약을 체결해야 한다.", "입찰공고 시마다 1회성 단기계약으로 종결된다."], "answer": 1, "explanation": "MAS 계약은 구매물자 품목별로 3년 내외의 장기계약으로 운영됩니다."}, {"id": 311, "category_id": 3, "question": "[3권 심화 Q11] 물가변동으로 인한 계약금액 조정(Escalation)의 요건으로 옳은 것은? ( 일괄입찰/대안입찰/기술제안입찰)의 설계변경 시 시공자 귀책사유인 경우의 계약금액 조정 원칙은? (계약실무 응용 10)", "options": ["계약금액을 증액할 수 없다.", "계약금액을 무조건 50% 증액한다.", "기획재정부장관 승인 시 증액 가능하다.", "물가변동률만큼 증액한다."], "answer": 0, "explanation": "3권 계약관리 법령 및 지침 해설: 기술형 공사에서 시공자 귀책사유로 인한 설계변경 시 계약금액 증액은 허용되지 않습니다."}, {"id": 400, "category_id": 3, "question": "[3권 심화 Q100] 다수공급자계약(MAS)의 계약기간 특성에 대한 설명으로 옳은 것은? (계약실무 응용 10)", "options": ["모든 MAS 계약은 단 1년으로 고정된다.", "품목별로 통상 3년(최대 10년 범위) 장기계약으로 체결된다.", "매월 재계약을 체결해야 한다.", "입찰공고 시마다 1회성 단기계약으로 종결된다."], "answer": 1, "explanation": "3권 계약관리 법령 및 지침 해설: MAS 계약은 구매물자 품목별로 3년 내외의 장기계약으로 운영됩니다."}, {"id": 401, "category_id": 4, "question": "나라장터(G2B) 물품목록화 체계에서 UNSPSC 기반 세부품명 식별번호의 자리수는?", "options": ["4자리", "6자리", "8자리", "10자리"], "answer": 3, "explanation": "나라장터 물품목록화 체계에서 세부품명은 10자리 숫자 코드로 관리됩니다(물품분류번호는 8자리)."}, {"id": 402, "category_id": 4, "question": "원가계산에 의한 예정가격 작성 시 제조원가 요소 5가지에 해당하지 않는 것은?", "options": ["직접재료비", "직접노무비", "직접경비", "영업외손실"], "answer": 3, "explanation": "제조원가 5대 요소는 직접재료비, 직접노무비, 직접경비, 간접노무비, 간접경비입니다."}, {"id": 403, "category_id": 4, "question": "원가계산 시 일반관리비 법정 최고 요율 한도(제조, 용역, 공사 공통)는?", "options": ["원가 요소의 3.0% 이내", "원가 요소의 6.0% 이내", "원가 요소의 10.0% 이내", "원가 요소의 15.0% 이내"], "answer": 1, "explanation": "제조, 용역, 공사 원가계산 시 일반관리비율 상한선은 6.0% 이내입니다."}, {"id": 404, "category_id": 4, "question": "제조원가 및 용역원가 계산 시 이윤(Profit) 산출기초 금액에서 제외되는 비목은?", "options": ["직접노무비", "직접경비", "직접재료비", "일반관리비"], "answer": 2, "explanation": "이윤은 (노무비 + 경비 + 일반관리비)를 기초로 계산하며, 재료비는 이윤 산출기초에서 제외됩니다."}, {"id": 405, "category_id": 4, "question": "공공조달 원가계산 시 이윤율 법정 최고 한도 기준 연결로 올바른 것은?", "options": ["제조·일반용역: 10.0% 이내 / 공사: 15.0% 이내", "제조: 5.0% 이내 / 공사: 20.0% 이내", "용역: 15.0% 이내 / 공사: 5.0% 이내", "제조·공사 모두 10.0% 이내"], "answer": 0, "explanation": "이윤율 한도는 제조 및 일반용역 10.0% 이내, 공사 15.0% 이내입니다."}, {"id": 406, "category_id": 4, "question": "나라장터 조달업체 등록 시 '공급물품'과 '제조물품'의 차이에 대한 설명으로 옳은 것은?", "options": ["공급물품 등록 시에는 반드시 직접생산확인증명서가 필요하다.", "제조물품 등록 시에는 공장등록증 및 직접생산확인 기준 충족이 필요하다.", "공급물품과 제조물품은 동일     // State
    let examData = defaultExamData;
    let viewMode = 'quiz'; // 'quiz' | 'study'
    let selectedCategoryId = 0; // 0=all, 1~4, 'random10'=1~3권 랜덤 10제
    let isRandom10Mode = false;
    let random10Questions = [];
    let filterType = 'all'; // 'all' | 'wrong' | 'bookmarked'
    let currentIndex = 0;
    let selectedAnswers = {};
    let bookmarkedIds = [];

    // Local Storage Loading
    try {
      const savedTheme = localStorage.getItem('procure_theme') || 'light';
      document.documentElement.dataset.theme = savedTheme;
      document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

      const savedBookmarks = localStorage.getItem('procure_bookmarks');
      if (savedBookmarks) bookmarkedIds = JSON.parse(savedBookmarks);

      const savedCustom = localStorage.getItem('procure_custom_exam_400');
      if (savedCustom) examData = JSON.parse(savedCustom);
    } catch (e) {}

    // Theme Toggle
    function toggleTheme() {
      const current = document.documentElement.dataset.theme || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('procure_theme', next);
    }

    // View Mode
    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('btn-mode-quiz').className = 'pill-btn ' + (mode === 'quiz' ? 'active' : '');
      document.getElementById('btn-mode-study').className = 'pill-btn ' + (mode === 'study' ? 'active' : '');
      renderCard();
    }

    // Filter
    function setFilter(type) {
      filterType = type;
      currentIndex = 0;
      document.getElementById('filter-all').className = 'chip-btn ' + (type === 'all' ? 'active' : '');
      document.getElementById('filter-wrong').className = 'chip-btn ' + (type === 'wrong' ? 'active-wrong' : '');
      document.getElementById('filter-star').className = 'chip-btn ' + (type === 'bookmarked' ? 'active-star' : '');
      render();
    }

    function setCategory(catId) {
      isRandom10Mode = false;
      selectedCategoryId = catId;
      currentIndex = 0;
      document.getElementById('random-banner').style.display = 'none';
      render();
    }

    // 1~3권 랜덤 10제 시험 모드 시작
    function startRandom10Exam() {
      // Filter questions from categories 1, 2, 3
      const pool = examData.questions.filter(q => [1, 2, 3].includes(q.category_id));
      // Shuffle
      const shuffled = [...pool].sort(() => 0.5 - Math.random());
      // Pick 10
      random10Questions = shuffled.slice(0, 10);
      isRandom10Mode = true;
      selectedCategoryId = 'random10';
      filterType = 'all';
      currentIndex = 0;

      document.getElementById('random-banner').style.display = 'flex';
      render();
    }

    function exitRandom10Mode() {
      isRandom10Mode = false;
      selectedCategoryId = 0;
      document.getElementById('random-banner').style.display = 'none';
      render();
    }

    function getFilteredQuestions() {
      if (isRandom10Mode) {
        return random10Questions;
      }
      return examData.questions.filter(q => {
        if (selectedCategoryId !== 0 && q.category_id !== selectedCategoryId) return false;
        if (filterType === 'bookmarked') return bookmarkedIds.includes(q.id);
        if (filterType === 'wrong') {
          const ans = selectedAnswers[q.id];
          return ans !== undefined && ans !== q.answer;
        }
        return true;
      });
    }

    function toggleBookmark(qId) {
      if (bookmarkedIds.includes(qId)) {
        bookmarkedIds = bookmarkedIds.filter(id => id !== qId);
      } else {
        bookmarkedIds.push(qId);
      }
      localStorage.setItem('procure_bookmarks', JSON.stringify(bookmarkedIds));
      updateCounts();
      renderCard();
    }

    function selectOption(optIdx) {
      const list = getFilteredQuestions();
      const currentQ = list[currentIndex];
      if (!currentQ) return;
      selectedAnswers[currentQ.id] = optIdx;
      updateCounts();
      render();
    }

    function resetCurrentQuestion() {
      const list = getFilteredQuestions();
      const currentQ = list[currentIndex];
      if (!currentQ) return;
      delete selectedAnswers[currentQ.id];
      updateCounts();
      renderCard();
    }

    function jumpToQuestion(idx) {
      currentIndex = idx;
      renderCard();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function nextQuestion() {
      const list = getFilteredQuestions();
      if (currentIndex < list.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    function updateCounts() {
      const list = isRandom10Mode ? random10Questions : examData.questions;
      const wrongCount = list.filter(q => {
        const ans = selectedAnswers[q.id];
        return ans !== undefined && ans !== q.answer;
      }).length;
      document.getElementById('wrong-count').textContent = wrongCount;
      document.getElementById('bookmark-count').textContent = bookmarkedIds.length;
    }

    function renderCategoryBar() {
      const container = document.getElementById('category-bar');
      let html = `<button class="cat-btn ${selectedCategoryId === 0 ? 'active' : ''}" onclick="setCategory(0)">전체 과목 (${examData.questions.length})</button>`;
      
      examData.categories.forEach(cat => {
        const count = examData.questions.filter(q => q.category_id === cat.id).length;
        html += `<button class="cat-btn ${selectedCategoryId === cat.id ? 'active' : ''}" onclick="setCategory(${cat.id})">${cat.name} (${count})</button>`;
      });

      // Special Random 10 Button
      html += `<button class="cat-btn random-mode ${isRandom10Mode ? 'active' : ''}" onclick="startRandom10Exam()">🎲 1~3권 랜덤 10제 시험</button>`;

      container.innerHTML = html;
    }

    function renderCard() {
      const list = getFilteredQuestions();
      if (currentIndex >= list.length) currentIndex = 0;
      const currentQ = list[currentIndex];

      // Update question selector
      const select = document.getElementById('question-select');
      select.innerHTML = list.map((q, idx) => `
        <option value="${idx}" ${idx === currentIndex ? 'selected' : ''}>
          ${isRandom10Mode ? `[${idx+1}번] ` : ''}문항 ${q.id} ${selectedAnswers[q.id] !== undefined ? '(풀이완료)' : ''}
        </option>
      `).join('');
      document.getElementById('question-counter').textContent = `(${list.length > 0 ? currentIndex + 1 : 0} / ${list.length})`;

      const cardContainer = document.getElementById('card-container');
      if (!currentQ) {
        cardContainer.innerHTML = `
          <div class="study-card" style="text-align: center; padding: 3.5rem;">
            <p style="font-size: 1.05rem; color: var(--text-muted); margin-bottom: 1.25rem;">선택한 조건에 해당하는 문제가 없습니다.</p>
            <button class="nav-action-btn primary" style="margin: 0 auto;" onclick="setCategory(0); setFilter('all');">전체 문제 보기</button>
          </div>
        `;
        return;
      }

      const catName = (examData.categories.find(c => c.id === currentQ.category_id) || {}).name || `과목 ${currentQ.category_id}`;
      const isBookmarked = bookmarkedIds.includes(currentQ.id);
      const userAns = selectedAnswers[currentQ.id];
      const isAnswered = userAns !== undefined;
      const showSolution = viewMode === 'study' || isAnswered;

      let choicesHtml = '';
      currentQ.options.forEach((opt, idx) => {
        const isSelected = userAns === idx;
        const isCorrect = currentQ.answer === idx;
        let choiceClass = 'choice-btn';
        if (isSelected) choiceClass += ' selected';
        if (showSolution) {
          if (isCorrect) choiceClass += ' is-correct';
          else if (isSelected && !isCorrect) choiceClass += ' is-wrong';
        }

        let tagHtml = '';
        if (showSolution && isCorrect) tagHtml = '<span class="choice-status-tag" style="color: var(--success)">✓ 정답</span>';
        else if (showSolution && isSelected && !isCorrect) tagHtml = '<span class="choice-status-tag" style="color: var(--danger)">✕ 오답</span>';

        choicesHtml += `
          <button class="${choiceClass}" onclick="selectOption(${idx})">
            <span class="choice-num">${idx + 1}</span>
            <span class="choice-label">${opt}</span>
            ${tagHtml}
          </button>
        `;
      });

      let solutionHtml = '';
      if (showSolution) {
        solutionHtml = `
          <div class="solution-box">
            <div class="solution-title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
              </svg>
              <span>정답: ${currentQ.answer + 1}번 & 해설</span>
            </div>
            <div class="solution-body">${currentQ.explanation}</div>
          </div>
        `;
      }

      let resetBtnHtml = '';
      if (isAnswered && viewMode === 'quiz') {
        resetBtnHtml = `<button class="btn-star" onclick="resetCurrentQuestion()" title="이 문제 다시 풀기">↺ 다시 풀기</button>`;
      }

      // Random 10 Summary info if finished
      let randomSummaryHtml = '';
      if (isRandom10Mode) {
        const answeredCount = random10Questions.filter(q => selectedAnswers[q.id] !== undefined).length;
        const correctCount = random10Questions.filter(q => selectedAnswers[q.id] === q.answer).length;
        if (answeredCount === 10) {
          const score = correctCount * 10;
          randomSummaryHtml = `
            <div class="score-card">
              <div class="score-title">🎉 10문항 풀이 완료!</div>
              <div class="score-val">${score}점 <span style="font-size: 1.1rem; color: var(--text-muted); font-weight: 600;">/ 100점 (${correctCount}개 정답)</span></div>
              <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">
                ${score >= 60 ? '축하합니다! 합격권 점수입니다.' : '조금만 더 복습해 보세요!'}
              </p>
              <button class="nav-action-btn primary" style="margin: 0.75rem auto 0 auto;" onclick="startRandom10Exam()">
                🔄 새로운 10문제 다시 뽑기
              </button>
            </div>
          `;
        }
      }

      cardContainer.innerHTML = `
        <div class="study-card">
          <div class="card-top">
            <div class="q-badge">
              <span class="badge-num">${isRandom10Mode ? `[${currentIndex+1}/10] ` : ''}문항 ${currentQ.id}</span>
              <span class="badge-cat">${catName}</span>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              ${resetBtnHtml}
              <button class="btn-star ${isBookmarked ? 'starred' : ''}" onclick="toggleBookmark(${currentQ.id})" title="단축키 B">
                ★ ${isBookmarked ? '북마크됨' : '북마크'}
              </button>
            </div>
          </div>

          <div class="question-text">${currentQ.question}</div>

          <div class="choices-container">${choicesHtml}</div>

          ${solutionHtml}
          ${randomSummaryHtml}

          <div class="card-footer">
            <button class="nav-action-btn" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''} title="단축키 ←">
              이전 문제
            </button>
            <span style="font-size: 0.825rem; color: var(--text-light)">키보드 1~4번 선택, 좌우 방향키로 이동</span>
            <button class="nav-action-btn primary" onclick="nextQuestion()" ${currentIndex === list.length - 1 ? 'disabled' : ''} title="단축키 →">
              다음 문제
            </button>
          </div>
        </div>
      `;
    }

    function render() {
      document.getElementById('page-title').textContent = examData.title;
      renderCategoryBar();
      updateCounts();
      renderCard();
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('json-modal').style.display === 'flex') return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (['1', '2', '3', '4'].includes(e.key)) {
        selectOption(parseInt(e.key, 10) - 1);
      } else if (e.key === 'ArrowLeft') {
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        nextQuestion();
      } else if (e.key.toLowerCase() === 'b') {
        const list = getFilteredQuestions();
        if (list[currentIndex]) toggleBookmark(list[currentIndex].id);
      }
    });

    // JSON Management
    function openJsonModal() {
      document.getElementById('json-textarea').value = JSON.stringify(examData, null, 2);
      document.getElementById('json-error').style.display = 'none';
      document.getElementById('json-modal').style.display = 'flex';
    }

    function closeJsonModal() {
      document.getElementById('json-modal').style.display = 'none';
    }

    function saveJsonData() {
      try {
        const val = document.getElementById('json-textarea').value;
        const parsed = JSON.parse(val);
        if (!parsed.questions || !Array.isArray(parsed.questions)) {
          throw new Error('questions 배열이 올바르지 않습니다.');
        }
        examData = parsed;
        localStorage.setItem('procure_custom_exam_400', JSON.stringify(parsed));
        closeJsonModal();
        render();
        alert(`저장되었습니다! (총 ${parsed.questions.length}문항)`);
      } catch (err) {
        const errorBox = document.getElementById('json-error');
        errorBox.textContent = err.message || 'JSON 형식이 잘못되었습니다.';
        errorBox.style.display = 'block';
      }
    }

    function resetToDefaultJson() {
      if (confirm('기본 400제 문제 데이터로 복원하시겠습니까?')) {
        examData = defaultExamData;
        localStorage.removeItem('procure_custom_exam_400');
        closeJsonModal();
        render();
      }
    }

    // Initialize
    render();
  </script>
</body>
</html>
